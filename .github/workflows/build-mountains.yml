name: build-mountains

# 산 마스터 재빌드. 원천이 거의 안 바뀌므로 월 1회면 충분하다.
#  · 산림청 산정보(3,368개) → 이름·표고·소재지·설명
#  · 전국등산로표준데이터(2,919건) → 코스·거리·소요시간·난이도
#  · 100대명산 목록/POI, 전국주요봉우리 POI → 봉우리 표고
#  · 국립공원 공원경계 → parkType 판정
#  · 국립공원 깃대종 → species
#  · 기상청 단기예보 격자 변환
#    (산악예보는 포털에 없어 쓰지 않는다 — kmaMountainCode 는 계속 null)
#
# 마지막에 혼잡도 산별 파라미터를 마스터 전체로 넓힌다. 이걸 빼먹으면 새로 들어온 산이
# 앱에서 전부 같은 폴백 값(baseIndex 45)을 쓰게 되어 혼잡도 정렬이 무의미해진다.

on:
  # ⛔ 예약 실행을 껐다 (2026-08-21). 이 잡은 이제 **맥에서 launchd 로 돈다.**
  #    시각의 단일 출처는 `~/claude/_pipelines/jobs.tsv`, 경위는 같은 곳 HANDOFF.md.
  #    둘 다 켜 두면 같은 산출물을 하루 두 번 만든다(셋은 시각까지 같았다).
  #    아래 `schedule:` 는 **되살릴 때 쓰라고 남긴다** — 왜 그 시각이었는지가 붙어 있다.
  #    수동 실행은 그대로 산다: `gh workflow run build-mountains.yml`
  # schedule:
    # - cron: "0 18 1 * *"   # 매월 1일 03:00 KST
  workflow_dispatch:
    inputs:
      limit:
        description: "대상 산 수 (비우면 전체 300)"
        required: false

permissions:
  contents: write

concurrency:
  group: build-mountains
  cancel-in-progress: false   # 마스터 빌드는 중간에 끊지 않는다

jobs:
  build:
    runs-on: ubuntu-latest
    # 산 300개 × 관광공사 사진 조회. 사진이 없는 산은 유형을 푼 2차 검색까지 가므로
    # 호출이 배로 늘어난다 — 실측 40분대. 여유를 두되 행(hang)은 잡히게 둔다.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 산 마스터 빌드
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          MOUNTAIN_LIMIT: ${{ inputs.limit }}
        run: python pipeline/build_mountains.py

      - name: 검증
        # 산 수·필수 필드·좌표·표고·코스 범위를 확인한다. 실패하면 커밋하지 않는다.
        run: python pipeline/validate.py data/v1/mountains.json

      - name: 혼잡도 산별 파라미터 확장
        # 새로 들어온 산은 앱에서 폴백(baseIndex 45)으로 전부 같아진다 — 여기서 채운다.
        # 5단계가 한쪽으로 쏠리면 종료 코드 1 이라 커밋되지 않는다.
        # --refresh: 마스터가 바뀌면 서열도 바뀌므로 추정치를 다시 계산한다.
        #            손입력(confidence high/medium)은 건드리지 않는다.
        run: python pipeline/build_crowd_params.py --refresh

      - name: 혼잡도 모델 검증
        run: python pipeline/validate.py data/v1/crowd_model.json

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v1/mountains.json data/v1/crowd_model.json data/v1/manifest.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "mountains: 마스터 재빌드"
          git push
