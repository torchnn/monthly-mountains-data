name: forecast-weather

# 산별 단기예보·대기질·특보를 받아 데이터 레포에 커밋한다.
#
# ── 왜 잡이 셋인가 (2026-08-18 원인 규명) ────────────────────────────────
# 실패 회차의 오류가 전부 ConnectTimeoutError 였다. 서버가 죽으면 RST 나 5xx 가 오지
# SYN 이 씹히지 않는다. 러너 IP 를 8개 표본으로 재 보니 **2개(25%)가 apis.data.go.kr 에
# 아예 못 붙었다.** 그리고 IP 단위로 완전히 갈린다 — 30/30 성공 아니면 0/30 실패다.
#
#   20.118.38.97(Iowa) 30/30      130.131.202.36(Iowa)    0/30
#   4.155.111.54(WA)   30/30      20.169.93.18(Arizona)   0/30
#   40.116.109.134(IL) 30/30      135.119.86.101(Iowa)   30/30
#   68.154.38.17(VA)   30/30      64.236.143.210(IL)     30/30
#
# 같은 순간 한국 회선(KT)에서는 10ms 만에 붙는다. data.go.kr 이 해외 클라우드 IP 대역
# 일부를 막고 있는 것으로 보인다. 실제 취소율 20/58 = 34% 와 표본 25% 가 들어맞는다.
#
# **그래서 재시도는 소용이 없다** — 같은 IP 로는 30번을 해도 0/30 이다.
# 필요한 것은 "다시 시도" 가 아니라 **다른 IP 로 다시 받기** 이고,
# GitHub 은 잡마다 새 러너 = 새 IP 를 준다. 잡을 사슬로 걸면 그게 된다.
# 25% 불량이면 1회 75% → 2회 94% → 3회 98.4%.
#
# 못 붙는 IP 를 받은 잡은 약 2분이면 끝난다(대기질 3곳 실패로 판정하고 그만둔다).
# 헛도는 비용이 작아서 세 번까지 거는 것이 싸다. 이 레포는 공개라 분 과금도 없다.

on:
  schedule:
    - cron: "20 */3 * * *"   # 발표 20분 뒤에 받는다 (KMA 는 정시 직후 갱신)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-weather
  cancel-in-progress: true

jobs:
  # 세 잡은 **각각 다른 러너**에서 돈다 = 각각 다른 egress IP.
  # 앞이 성공하면 뒤는 아예 안 돈다.
  attempt-1:
    runs-on: ubuntu-latest
    # 붙는 회차는 실측 9~13분. 못 붙는 회차는 2분이면 끝난다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: ./.github/actions/collect-forecast
        with:
          data-key: ${{ secrets.DATA_GO_KR_KEY }}

  # ⚠️ `if: failure()` 를 쓰면 안 된다 — 그건 "직전 잡" 이 아니라 **앞의 아무 잡이나
  # 실패했으면** 이다. 1이 실패하고 2가 성공해도 3이 돈다. 결과를 직접 본다.
  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.result == 'failure' 
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: ./.github/actions/collect-forecast
        with:
          data-key: ${{ secrets.DATA_GO_KR_KEY }}

  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.result == 'failure' 
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: ./.github/actions/collect-forecast
        with:
          data-key: ${{ secrets.DATA_GO_KR_KEY }}

  # 세 번 다 못 붙었을 때만 온다. 그래도 **바로 빨간불은 아니다** —
  # 한 회차를 놓치는 것 자체는 사고가 아니고(3시간 뒤 회차가 이어받는다),
  # 회차마다 메일이 오면 사람이 곧 안 보게 된다. 정말 낡았을 때만 켠다.
  # 판정은 collect_weather.py 가 manifest 의 forecastUpdatedAt 을 보고 이미 하고 있다.
  report:
    needs: attempt-3
    # `always()` 가 없으면 attempt-3 이 skip 될 때 이 잡도 같이 skip 되어
    # 조건을 볼 기회조차 없다.
    if: always() && needs.attempt-3.result == 'failure' 
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: 세 IP 모두 실패 — 얼마나 낡았는지 보고 판정
        run: |
          python3 - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          STALE_H = 9
          m = json.load(open("data/v1/manifest.json"))
          stamp = m.get("forecastUpdatedAt")
          print(f"러너 세 대가 전부 apis.data.go.kr 에 붙지 못했습니다.")
          if not stamp:
              print("마지막 성공 시각 기록이 없어 이번은 넘어갑니다.")
              sys.exit(0)
          then = datetime.strptime(stamp, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
          h = (datetime.now(timezone.utc) - then).total_seconds() / 3600
          print(f"마지막으로 예보를 받은 것은 {h:.1f}시간 전입니다.")
          if h < STALE_H:
              print(f"{STALE_H}시간 안이라 다음 회차(3시간 뒤)가 이어받습니다 — 넘어갑니다.")
              sys.exit(0)
          print(f"{STALE_H}시간을 넘겼습니다. 확인이 필요합니다.")
          sys.exit(1)
          PY
