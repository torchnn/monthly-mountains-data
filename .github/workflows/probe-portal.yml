name: probe-portal

# 진단 전용. 두 가지를 잰다.
#   ① 러너 IP 중 몇 %가 apis.data.go.kr 에 못 붙는가 (표본을 늘린다)
#   ② **같은 워크플로 실행 안의 잡들이 서로 독립적인 IP 를 받는가**
#      — 재시도 사슬이 통하려면 이게 참이어야 한다. 같은 풀에서 뽑히면 사슬은 헛것이다.

on:
  push:
    branches: [probe/portal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]      # 한 실행에서 러너 6대 = 표본 6개
    steps:
      - name: "표본 ${{ matrix.n }}"
        run: |
          ip=$(curl -s --max-time 10 https://ipinfo.io/ip || echo "?")
          org=$(curl -s --max-time 10 https://ipinfo.io/org || echo "?")
          ok=0; fail=0
          for i in $(seq 1 6); do
            c=$(curl -s -o /dev/null --max-time 8 -w "%{http_code}" \
                 "https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?serviceKey=dummy" \
                 2>/dev/null) || c="000"
            [ "$c" = "000" ] && fail=$((fail+1)) || ok=$((ok+1))
          done
          verdict=$([ "$ok" -gt 0 ] && echo 붙음 || echo 못붙음)
          echo "RESULT|${{ matrix.n }}|$ip|$org|$ok/6|$verdict"
